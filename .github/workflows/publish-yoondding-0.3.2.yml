name: Publish Yoondding 0.3.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-yoondding-0.3.2.yml'
permissions:
  contents: write
concurrency:
  group: yoondding-release-0.3.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify replacement file
        run: |
          echo '0c839d258f9d1355e9134f9ece6f596a5bf9c76ab85b8d907b09ed863de8ac8d  mods/releases/yoondding-fabric-0.3.2.jar' | sha256sum -c -
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("mods/releases/yoondding-fabric-0.3.2.jar") as z:
              assert z.testzip() is None
              assert json.loads(z.read("fabric.mod.json"))["version"] == "0.3.2"
              assert "version=0.3.2" in z.read("META-INF/nakin-update.properties").decode().splitlines()
          PY
          cd mods/releases
          sha256sum yoondding-fabric-0.3.2.jar > yoondding-fabric-0.3.2.jar.sha256
      - name: Replace existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=yoondding-v0.3.2
          gh release view "$TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
          gh release upload "$TAG" mods/releases/yoondding-fabric-0.3.2.jar mods/releases/yoondding-fabric-0.3.2.jar.sha256 --clobber
