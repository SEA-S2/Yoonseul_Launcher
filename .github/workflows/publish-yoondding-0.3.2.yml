name: Publish Yoondding 0.3.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-yoondding-0.3.2.yml'
permissions:
  contents: write
concurrency:
  group: yoondding-release-0.3.2
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify supplied release file
        run: |
          echo '1f9d0e38bdac130189b327bd3308b6d775a24ad947ce51349f750e60e5cc55cc  mods/releases/yoondding-fabric-0.3.2.jar' | sha256sum -c -
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("mods/releases/yoondding-fabric-0.3.2.jar") as z:
              assert z.testzip() is None
              assert json.loads(z.read("fabric.mod.json"))["version"] == "0.3.2"
          PY
          cd mods/releases
          sha256sum yoondding-fabric-0.3.2.jar > yoondding-fabric-0.3.2.jar.sha256
      - name: Publish verified JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=yoondding-v0.3.2
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "윤띵 0.3.2" --notes-file RELEASE_NOTES_YOONDDING_0.3.2.md
          fi
          gh release upload "$TAG" mods/releases/yoondding-fabric-0.3.2.jar mods/releases/yoondding-fabric-0.3.2.jar.sha256 --clobber
          gh release edit "$TAG" --draft=false --latest=false --title "윤띵 0.3.2" --notes-file RELEASE_NOTES_YOONDDING_0.3.2.md
