name: Build Girinworld Core

on:
  workflow_dispatch:
  push:
    branches: [girinworld-core]
    paths:
      - 'mods/girinworld-core-src.zip'
      - 'tools/remove-custom-time.patch'
      - '.github/workflows/build-girinworld-core.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack source
        run: unzip -q mods/girinworld-core-src.zip -d build-src
      - name: Remove custom time feature
        working-directory: build-src/girinworld-core
        run: patch --batch -p3 < ../../tools/remove-custom-time.patch
      - name: Verify custom time removal
        working-directory: build-src/girinworld-core
        shell: bash
        run: |
          ! grep -R -E '사용자 지정 시간|CustomTimeController|TIME_PRESET|matchesTimePreset' \
            src/main/java/kr/girinworld/core/Hooks.java \
            src/main/java/kr/girinworld/core/KeyBindings.java \
            src/main/java/kr/girinworld/core/features/settings/ModuleRegistry.java
      - name: Build Minecraft 26.2 core
        working-directory: build-src/girinworld-core
        run: gradle build --stacktrace
      - name: Inspect Minecraft 26.2 GUI signatures
        working-directory: build-src/girinworld-core
        shell: bash
        run: |
          gradle -q printCompileClasspath > /tmp/girinworld-classpath.txt
          CP="$(tail -n 1 /tmp/girinworld-classpath.txt)"
          javap -classpath "$CP" -private -s net.minecraft.client.gui.Gui
          javap -classpath "$CP" -private -s net.minecraft.client.gui.Hud
          javap -classpath "$CP" -private -s net.minecraft.client.renderer.state.gui.GuiRenderState
      - name: Publish core to launcher branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git worktree add -B launcher-main /tmp/launcher-main origin/main
          cp build-src/girinworld-core/build/libs/girinworld-core-0.3.0.jar /tmp/launcher-main/assets/girinworld-core-26.2.jar
          cd /tmp/launcher-main
          git add assets/girinworld-core-26.2.jar
          git commit -m "Remove custom time from Girinworld core"
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: girinworld-core-26.2
          path: build-src/girinworld-core/build/libs/girinworld-core-0.3.0.jar
          if-no-files-found: error
