name: Build Yoondding

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mods/yoondding-0.3.1-src.zip'
      - 'RELEASE_NOTES_YOONDDING_0.3.1.md'
      - '.github/workflows/build-yoondding.yml'

permissions:
  contents: write

concurrency:
  group: yoondding-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: build/yoondding/.cache
          key: yoondding-java25-minecraft26.2-fabric0.161.0-v1
      - name: Unpack release sources
        run: |
          mkdir -p build/yoondding
          unzip -q mods/yoondding-0.3.1-src.zip -d build/yoondding
      - name: Build and verify Yoondding 0.3.1
        run: python build/yoondding/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: yoondding-fabric-0.3.1
          path: |
            build/yoondding/build/yoondding-fabric-0.3.1.jar
            build/yoondding/build/yoondding-fabric-0.3.1.jar.sha256
          if-no-files-found: error
      - name: Publish Yoondding 0.3.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=yoondding-v0.3.1
          JAR=build/yoondding/build/yoondding-fabric-0.3.1.jar
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "윤띵 0.3.1" --notes-file RELEASE_NOTES_YOONDDING_0.3.1.md
          fi
          gh release upload "$TAG" "$JAR" "$JAR.sha256" --clobber
          gh release edit "$TAG" --title "윤띵 0.3.1" --notes-file RELEASE_NOTES_YOONDDING_0.3.1.md --draft=false --latest=false
