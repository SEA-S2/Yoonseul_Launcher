name: Build Yoondding

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/yoonseul-helper-src.zip'
      - '.github/workflows/build-yoondding.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack Yoondding source
        run: |
          mkdir -p build/yoondding
          unzip -q mods/yoonseul-helper-src.zip -d build/yoondding
      - name: Test and build Yoondding
        working-directory: build/yoondding
        run: gradle :fabric:test :fabric:build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoondding-fabric-0.2.4
          path: build/yoondding/fabric/build/libs/yoondding-fabric-0.2.4.jar
          if-no-files-found: error
      - name: Publish Yoondding 0.2.4
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=build/yoondding/fabric/build/libs/yoondding-fabric-0.2.4.jar
          gh release create yoondding-v0.2.4 --title "윤띵 0.2.4" --notes "윤띵 0.2.4입니다.\n\n- 기린월드 위키에 없는 금고·스킬 수리 비용·바다의 가호 설정 제거\n- 이체 표기를 사용자 간 송금 기준으로 정리\n- 플리마켓 수수료 선택지를 1%·2%·3%로 제한\n- /낙인 및 /nakin 원작 명령어 제거"
          gh release upload yoondding-v0.2.4 "$JAR"
