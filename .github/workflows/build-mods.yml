name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '*.spec'
      - 'frontend/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'launcher_config.json'
      - 'tools/patch_launcher_agent.py'

permissions:
  contents: write

jobs:
  build-launcher:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Connect Girinworld 26.2 core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher_config.json dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.7.0
          path: dist/Yoonseul_Launcher.exe
          if-no-files-found: error
      - name: Publish 2.7.0 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.7.0 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v2.7.0 --title "2.7.0" --notes "타이머 알림음 업데이트" }
          gh release upload v2.7.0 dist/Yoonseul_Launcher.exe --clobber
          gh release edit v2.7.0 `
            --title "2.7.0" `
            --notes "윤슬 런처 2.7.0입니다.`n`n- 클라이언트 허브 타이머 알림음을 전용 음성 알림으로 변경`n- 타이머 기본 알림 음량을 100%로 상향`n- 설정의 알림 크기로 음량 조절 가능`n- 윤띵은 런처에 포함하지 않으며 필요한 경우 별도로 설치" `
            --latest
