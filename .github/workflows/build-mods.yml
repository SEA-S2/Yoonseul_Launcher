name: Build Yoonseul Private Test

on:
  workflow_dispatch:
  push:
    branches:
      - test/giraffe-required-2.7.2
    paths:
      - 'giraffe_required.py'
      - 'tools/apply_giraffe_test_patch.py'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: read

jobs:
  build-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Apply private test changes
        run: python tools/apply_giraffe_test_patch.py
      - name: Connect Girinworld 26.2 core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.7.2-test
          path: dist/Yoonseul_Launcher.exe
          if-no-files-found: error
