name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '*.spec'
      - 'frontend/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'launcher_config.json'
      - 'tools/patch_launcher_agent.py'

permissions:
  contents: write

jobs:
  build-launcher:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Connect Girinworld 26.2 core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher_config.json dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.6.9
          path: dist/Yoonseul_Launcher.exe
          if-no-files-found: error
      - name: Publish 2.6.9 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.6.9 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v2.6.9 --title "2.6.9" --notes "연보라 노을 테마 업데이트" }
          gh release upload v2.6.9 dist/Yoonseul_Launcher.exe --clobber
          gh release edit v2.6.9 `
            --title "2.6.9" `
            --notes "윤슬 런처 2.6.9입니다.`n`n- 라이트 테마를 연보라·살구빛 노을 색상으로 변경`n- 다크 테마를 남보라·자주빛 저녁 하늘 색상으로 변경`n- 카드·버튼·강조색을 새 테마와 어울리도록 조정`n- 윤띵은 런처에서 제외되며 필요한 경우 별도로 설치" `
            --latest
