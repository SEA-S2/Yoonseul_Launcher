name: Build Yoonseul Mods

on:
  workflow_dispatch:
  push:
    paths:
      - 'mods/**'
      - '*.py'
      - '*.spec'
      - 'frontend/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'launcher_config.json'
      - 'tools/patch_launcher_agent.py'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: write

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Unpack Yoondding source
        run: |
          mkdir -p build/yoonseul-helper
          unzip -q mods/yoonseul-helper-src.zip -d build/yoonseul-helper
      - name: Build Yoondding
        working-directory: build/yoonseul-helper
        run: gradle :fabric:build -x test --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.9
          path: build/yoonseul-helper/fabric/build/libs/yoonseul-ledger-fabric-0.2.9.jar
          if-no-files-found: error

  build-launcher:
    if: github.ref == 'refs/heads/main'
    needs: [build-ledger]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yoonseul-ledger-fabric-0.2.9
          path: assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Connect Girinworld 26.2 core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - name: Prepare distribution
        shell: pwsh
        run: Copy-Item launcher_config.json dist/launcher_config.json
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.6.8
          path: dist/Yoonseul_Launcher.exe
          if-no-files-found: error
      - name: Publish 2.6.8 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.6.8 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v2.6.8 --title "2.6.8" --notes "윤띵 0.2.9 업데이트" }
          gh release upload v2.6.8 dist/Yoonseul_Launcher.exe --clobber
          gh release edit v2.6.8 `
            --title "2.6.8" `
            --notes "윤슬 런처 2.6.8입니다.`n`n- 윤띵 0.2.9 업데이트`n- YACL 없이 동작하는 윤띵 자체 설정 화면 추가`n- HUD 수입·지출 분야별 표시 개수 설정 추가`n- 하루 기준 시각 변경 시 기존 기록 재집계" `
            --latest
