name: Build Yoonseul Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - '*.py'
      - '*.spec'
      - 'frontend/**'
      - 'assets/**'
      - 'requirements.txt'
      - 'launcher_config.json'
      - 'tools/patch_launcher_agent.py'
      - 'tools/prepare_girin_assets.py'
      - 'tools/girin_required_*.json'
      - 'tests/test_girin*'
      - '.github/workflows/build-mods.yml'

permissions:
  contents: write

concurrency:
  group: launcher-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-launcher:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connect Girinworld core
        run: python tools/patch_launcher_agent.py . assets/girinworld-core-26.2.jar
      - name: Prepare verified official required mods
        run: python tools/prepare_girin_assets.py
      - name: Check required mods and saved connection settings
        run: |
          python tests/test_girin_release.py
          node tests/test_girin_required_ui.js
          node tests/test_girin_connection_ui.js
      - name: Install launcher dependencies
        run: python -m pip install --upgrade -r requirements.txt
      - name: Build Windows launcher
        run: python -m PyInstaller --noconfirm Yoonseul_Launcher.spec
      - uses: actions/upload-artifact@v4
        with:
          name: Yoonseul_Launcher-2.7.2
          path: dist/Yoonseul_Launcher.exe
          if-no-files-found: error
      - name: Publish 2.7.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.7.2 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.7.2 --target $env:GITHUB_SHA --draft --title "2.7.2" --notes-file RELEASE_NOTES_2.7.2.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v2.7.2 dist/Yoonseul_Launcher.exe --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v2.7.2 --title "2.7.2" --notes-file RELEASE_NOTES_2.7.2.md --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
